<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Crestpoint Global mark">
  <defs>
    <linearGradient id="cpBlue" x1="18" y1="30" x2="100" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fd3ff"/>
      <stop offset=".45" stop-color="#2f9bff"/>
      <stop offset="1" stop-color="#1457d6"/>
    </linearGradient>
    <linearGradient id="cpSilver" x1="10" y1="20" x2="110" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#b9cbe2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5d7595" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="cpGold" x1="30" y1="24" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9ab"/>
      <stop offset=".55" stop-color="#f0bb45"/>
      <stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
    <radialGradient id="cpGlobe" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#12365e"/>
      <stop offset="1" stop-color="#050e1c"/>
    </radialGradient>
  </defs>

  <!-- outer energy halo -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#cpBlue)" stroke-opacity=".18" stroke-width="1"/>

  <!-- silver rear orbit arc -->
  <path d="M22.5 84.5A41 41 0 0 1 55 19.2" fill="none" stroke="url(#cpSilver)" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M55 19.2l-8.6 2.9 2.2 8.9z" fill="#c9d8ea"/>

  <!-- blue front orbit arc -->
  <path d="M96.5 39.5A41 41 0 0 1 68 101" fill="none" stroke="url(#cpBlue)" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M68 101l8.2-3.8-3-8.6z" fill="#2f9bff"/>

  <!-- globe -->
  <circle cx="60" cy="60" r="29" fill="url(#cpGlobe)" stroke="url(#cpGold)" stroke-width="2.2"/>
  <g fill="none" stroke="#8fd6ff" stroke-width="1.15" stroke-opacity=".75">
    <ellipse cx="60" cy="60" rx="29" ry="11.5"/>
    <ellipse cx="60" cy="60" rx="11.5" ry="29"/>
    <path d="M31 60h58"/>
    <path d="M36 45.5h48M36 74.5h48"/>
  </g>
  <!-- gold continent accents -->
  <g fill="url(#cpGold)" opacity=".9">
    <path d="M47 47c3-2 7-2 9 0 1 2-1 4-3 5-2 1-1 3-3 3s-5-6-3-8z"/>
    <path d="M66 63c3-1 6 1 6 4 0 2-2 3-4 3-3 0-4-5-2-7z"/>
    <path d="M54 72c2-1 4 0 4 2s-3 4-5 3-1-4 1-5z"/>
  </g>

  <!-- north star accent -->
  <g transform="translate(92 24)">
    <path d="M0 -6L1.6 -1.6 6 0 1.6 1.6 0 6 -1.6 1.6 -6 0 -1.6 -1.6Z" fill="url(#cpGold)"/>
  </g>
</svg>